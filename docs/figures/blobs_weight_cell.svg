<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="title description">
<title id="title">One actual learning cell</title>
<desc id="description">Transistor-level schematic of the class 0, input 0 weight cell in blobs.cir.</desc>
<style>text{font-family:Arial,sans-serif;fill:#1f2937}.net{font-family:monospace;fill:#075985;font-size:14px}.wire{fill:none;stroke:#334155;stroke-width:2;stroke-linejoin:round}.note{fill:#526175;font-size:15px}</style>
<rect width="1120" height="980" fill="white"/>
<text x="30" y="38" font-size="27" text-anchor="start">Inside the two-input learner</text>
<text x="30" y="69" class="note" text-anchor="start">One complete weight cell from competition/examples/blobs.cir. All device names and values come from that file.</text>
<text x="30" y="95" class="note" text-anchor="start">MOS: D = drain, S = source; gate enters from left. Bubble = PMOS. Bodies: nch/syn → 0, pch → vdd.</text>
<text x="30" y="119" class="note" text-anchor="start">0 = ground. Named bias, input, target, reset and learn ports are driven by the runner; its sources/loads are not shown.</text>
<rect x="8" y="153" width="1104" height="814" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="187" font-size="23" text-anchor="start">Class 0 · in0 weight cell</text>
<text x="30" y="214" class="note" text-anchor="start">9 transistors + 1 capacitor. Matching blue net labels are electrically connected.</text>
